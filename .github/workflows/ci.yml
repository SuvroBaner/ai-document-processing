name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Ruff
        run: ruff check app tests scripts
      - name: Import-linter (module boundaries)
        run: lint-imports
      - name: Mypy
        run: mypy app
        continue-on-error: true
      - name: Pytest
        run: pytest -q
      - name: Extraction eval (non-blocking)
        run: python -m app.extraction.eval.runner > eval-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
