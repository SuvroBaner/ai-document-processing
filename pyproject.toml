[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-processing"
version = "0.1.0"
description = "AI-driven structured extraction and workflow platform for construction submittals."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "boto3>=1.35",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.12",
    "openai>=1.54",
    "jsonschema>=4.23",
    "jinja2>=3.1",
    "python-statemachine>=2.3",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-jsonschema",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Domain modules do not import each other directly"
type = "independence"
modules = [
    "app.ingestion",
    "app.extraction",
    "app.review",
    "app.workflow",
    "app.vocabulary",
    "app.plans",
    "app.output",
]

[[tool.importlinter.contracts]]
name = "Common is leaf — does not import domain modules"
type = "forbidden"
source_modules = ["app.common"]
forbidden_modules = [
    "app.ingestion",
    "app.extraction",
    "app.review",
    "app.workflow",
    "app.vocabulary",
    "app.plans",
    "app.output",
    "app.projects",
]
